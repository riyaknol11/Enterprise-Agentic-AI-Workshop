# ─── Application ──────────────────────────────────────────────────────────────
spring.application.name=langchain4j-chatbot
server.port=8080

# ─── OpenAI Model Configuration ───────────────────────────────────────────────
# Replace "your-openai-api-key-here" with your actual OpenAI API key
# OR set it as an environment variable: OPENAI_API_KEY=sk-...
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY:your-openai-api-key-here}

# Model to use (gpt-3.5-turbo is cheaper; gpt-4o is smarter)
langchain4j.open-ai.chat-model.model-name=gpt-3.5-turbo

# ─── Model Parameter: Temperature ─────────────────────────────────────────────
# Range: 0.0 to 1.0
# 0.1 = Very focused, predictable, factual responses (good for FAQs)
# 0.5 = Balanced (good for general chat)
# 0.9 = Very creative, varied, imaginative responses
langchain4j.open-ai.chat-model.temperature=0.7

# ─── Model Parameter: Max Tokens ──────────────────────────────────────────────
# Controls the maximum length of the AI's response
# 100 = Very short replies
# 500 = Medium replies (default here)
# 2000 = Long detailed replies
langchain4j.open-ai.chat-model.max-tokens=500

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.chatbot=DEBUG
logging.level.dev.langchain4j=DEBUG
